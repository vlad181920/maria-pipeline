name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps (jsonschema)
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Sanity: project layout
        run: |
          test -f schemas/event.schema.json
          test -f schemas/command.schema.json
          test -f schemas/metrics_summary.schema.json
          test -f scripts/health.sh
          test -f tools/bus_dispatcher.py

      - name: Quick schema smoke (no fail if artifacts absent)
        run: |
          set -e
          if [ -f artifacts/earn/experiments/20250919_211414__micro-service-offer-audit-implementation/metrics_summary.json ]; then
            python - <<'PY'
import json
from jsonschema import validate
ms = json.load(open("artifacts/earn/experiments/20250919_211414__micro-service-offer-audit-implementation/metrics_summary.json"))
schema = json.load(open("schemas/metrics_summary.schema.json"))
validate(ms, schema)
print("metrics_summary.json OK")
PY
          else
            echo "No runtime artifacts in CI (expected). Skipping."
          fi

      - name: Done
        run: echo "CI OK"
