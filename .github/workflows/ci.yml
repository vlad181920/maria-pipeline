name: CI
on:
  pull_request:
  push:
    branches: [ main, feat/** ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Sanity checks
        run: |
          test -f schemas/event.schema.json
          test -f schemas/command.schema.json
          test -f schemas/metrics_summary.schema.json
          python -c "import json, sys; print('ok')"
