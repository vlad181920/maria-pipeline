name: CI
on:
  pull_request:
  push:
    branches: [ main, feat/** ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema
      - name: Lint shell (shfmt only)
        uses: mvdan/shfmt@v3
        with:
          args: -i 2 -d .
      - name: Validate schemas (sanity)
        run: |
          test -f schemas/event.schema.json
          test -f schemas/command.schema.json
          test -f schemas/metrics_summary.schema.json
      - name: Smoke import Python
        run: |
          python -c "import json,sys; print('ok')"
